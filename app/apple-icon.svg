<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Sem cantos arredondados e sem transparência: o iOS já arredonda e já
       recorta o ícone da tela de início. Um SVG com raio próprio sai com
       borda dupla, e com fundo transparente sai preto no aparelho. -->
