  <g transform="translate(34 34) scale(1.75)">
    <path d="M20 16h24M20 16v32M20 48h24M20 32h16" stroke="#06B6D4" stroke-width="5" stroke-linecap="round" fill="none" transform="translate(-14 -14)"/>
    <circle cx="32" cy="18" r="4" fill="#06B6D4"/>
  </g>
</svg>
